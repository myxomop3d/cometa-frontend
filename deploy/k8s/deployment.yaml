apiVersion: apps/v1
kind: Deployment
metadata:
  name: cometa-frontend
  labels:
    app: cometa-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cometa-frontend
  template:
    metadata:
      labels:
        app: cometa-frontend
        version: v1            # Istio uses this for subsets/telemetry
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      # nginx-unprivileged runs as uid 101; enforce non-root at the Pod level.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: cometa-frontend:latest      # replace with your registry ref
          imagePullPolicy: IfNotPresent
          ports:
            - name: http                     # named 'http' so the Istio sidecar
              containerPort: 8080            # detects HTTP/1.1 for L7 routing
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # nginx-unprivileged needs a few writable paths when the root fs
          # is read-only. Mount tmpfs for them.
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
