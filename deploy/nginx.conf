# SPA static-file server for the Cometa frontend.
#
# Istio terminates TLS/mTLS and handles /api routing at the gateway,
# so nginx only speaks plain HTTP and only has two jobs:
#   1. serve the static bundle
#   2. fall back to index.html for client-side routes
# There is deliberately NO TLS and NO proxy_pass here.

server {
    listen       8080;              # plain HTTP, non-root port
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # gzip for text assets (JS/CSS/JSON/SVG). Vite already minifies.
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript
                    application/json image/svg+xml application/manifest+json;

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html must never be cached, or clients pin a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Everything else → SPA fallback so hard-refresh on /box-dice works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
